[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

# project metadata

[project]
name = "hexdoc-miehex"
description = "miehex (big package) addon for Hex Casting."
readme = "doc/README.md"
authors = [
    { name="xm1221" },
]
keywords = ["hexdoc"]
requires-python = ">=3.12"
version = "1.0.2.1.20.1.1.0"
dependencies = [
    "hexdoc-hexcasting~=0.11.3.1.0",
]

[project.urls]
Homepage = "https://github.com/xm1221/miehex_for_bigpackage"
Source = "https://github.com/xm1221/miehex_for_bigpackage"

# directory inclusion

[tool.hatch.build]
only-include = [
    "doc/src/hexdoc_miehex",
]
artifacts = [
    "/doc/src/hexdoc_miehex/_export/generated",
]

[tool.hatch.build.targets.wheel]
sources = ["doc/src"]

# hexdoc entry point

[project.entry-points.hexdoc]
miehex = "hexdoc_miehex._hooks:MiehexPlugin"
