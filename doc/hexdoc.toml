modid = "miehex"
book = "hexcasting:thehexbook"

resource_dirs = [  # top takes priority
    "resources",
    "../src/main/resources",
    { modid="hexcasting" },
    { modid="minecraft" },
    { modid="hexdoc" },
]
export_dir = "src/hexdoc_miehex/_export/generated"

[template]
icon = "../src/main/resources/assets/miehex/icon.png"
include = [
    "miehex",
    "hexcasting",
    "hexdoc",
]

[template.args]
mod_name = "miehex"
author = "xm1221"
show_landing_text = false

[extra.hexcasting]
# NOTE: "!Raw" means "don't apply variable interpolation to this value"
# Java-style registration: ActionRegistryHelper.register("name","angles", HexDir.XXX, ...)
_pattern_regex = { "!Raw"='register\("(?P<name>[^"]+)","(?P<signature>[qweasd]+)",\s*HexDir\.(?P<startdir>\w+)' }

[[extra.hexcasting.pattern_stubs]]
path = "../src/main/java/cn/xm1221/miehex/registry/ActionRegisry.java"
regex = "{^_pattern_regex}"
