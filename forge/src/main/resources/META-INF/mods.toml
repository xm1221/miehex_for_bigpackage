[[dependencies.miehex]]
modId = "minecraft"
mandatory = true
versionRange = "[${versions.minecraft},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miehex]]
modId = "architectury"
mandatory = true
versionRange = "[${versions.architectury},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miehex]]
modId = "cloth_config"
mandatory = true
versionRange = "[${versions.clothConfig},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miehex]]
modId = "hexcasting"
mandatory = true
versionRange = "[${versions.hexcasting},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miehex]]
# hexparse is an optional integration, not a hard requirement
modId = "hexparse"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "BOTH"

