[[mods]]
modId = "miehex"
version = "${version}"
displayName = "miehex"
logoFile = "assets/miehex/icon.png"
authors = "xm1221"
description = "miehex (big package) addon for Hex Casting."

[[dependencies.miehex]]
modId = "forge"
mandatory = true
