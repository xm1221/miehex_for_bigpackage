# non-minecraft values
org.gradle.jvmargs=-Xmx4096M
jetbrainsAnnotationsVersion=23.0.0

# HexDummy 模板要求 Gradle 8.x（shadow 7.1.2 不兼容 Gradle 9），而 Gradle 8.13 无法在 JDK 25 上运行。
# 本机 PATH 上的 java 是 25，故显式把 Gradle 守护进程固定到 JDK 17。
# 换机器时改这一行即可（或删掉它并用 JAVA_HOME 指向 JDK 17 运行 gradlew）。
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# gradle kotlin jvm plugin breaks without this
kotlin.stdlib.default.dependency=false

# mod info
mavenGroup=cn.xm1221.miehex
modId=miehex
modVersion=1.0.2+0.11.4

# game version for hexdoc
minecraftVersion=1.20.1

